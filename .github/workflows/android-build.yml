name: Android Build (Native Kotlin)

on:
    push:
        branches:
            - master
            - main
        paths:
            - 'android/**'
            - '.github/workflows/android-build.yml'
        tags:
            - 'v*'
    pull_request:
        paths:
            - 'android/**'
            - '.github/workflows/android-build.yml'
    workflow_dispatch:

concurrency:
    group: android-native-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    ANDROID_API_LEVEL: '35'
    ANDROID_BUILD_TOOLS_VERSION: '35.0.0'

jobs:
    build-apk:
        name: Build Android APK
        runs-on: ubuntu-latest

        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: >-
                      platform-tools
                      platforms;android-${{ env.ANDROID_API_LEVEL }}
                      build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}

            - name: Export Android SDK root
              shell: bash
              run: |
                  set -euo pipefail
                  SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
                  if [[ -z "${SDK_ROOT}" ]]; then
                    echo "Android SDK root was not set by the setup-android action" >&2
                    exit 1
                  fi
                  {
                    echo "ANDROID_HOME=${SDK_ROOT}"
                    echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
                  } >> "${GITHUB_ENV}"

            - name: Cache Gradle dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      android/.gradle
                  key: android-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      android-gradle-${{ runner.os }}-

            - name: Grant execute permission for gradlew
              run: chmod +x android/gradlew

            - name: Build debug APK
              working-directory: android
              run: ./gradlew assembleDebug --no-daemon --stacktrace

            - name: Upload debug APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: gpt-image-playground-debug-apk
                  path: android/app/build/outputs/apk/debug/*.apk
                  if-no-files-found: error
                  retention-days: 30

            - name: Build release APK (unsigned)
              working-directory: android
              run: ./gradlew assembleRelease --no-daemon --stacktrace
              continue-on-error: true

            - name: Upload release APK artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: gpt-image-playground-release-apk-unsigned
                  path: android/app/build/outputs/apk/release/*.apk
                  if-no-files-found: ignore
                  retention-days: 30
